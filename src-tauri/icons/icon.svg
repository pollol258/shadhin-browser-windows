<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <!-- Bangladesh Premium Green Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007A59" />
      <stop offset="100%" stop-color="#004735" />
    </linearGradient>
    
    <!-- Glass Reflection -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Outer Glass Border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Compass Dial (Safari Style) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="12" />
  <circle cx="256" cy="256" r="154" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" />

  <!-- Tick Marks -->
  <g stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="96" x2="256" y2="116" />
    <line x1="256" y1="396" x2="256" y2="416" />
    <line x1="96" y1="256" x2="116" y2="256" />
    <line x1="396" y1="256" x2="416" y2="256" />
  </g>

  <!-- North Needle (Bangladesh Red - Independence) -->
  <path d="M 256 110 L 300 256 L 256 256 Z" fill="#F42A41" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linejoin="round" />
  
  <!-- South Needle (White) -->
  <path d="M 256 402 L 212 256 L 256 256 Z" fill="#FFFFFF" stroke="rgba(0,0,0,0.1)" stroke-width="2" stroke-linejoin="round" />

  <!-- Center Pin -->
  <circle cx="256" cy="256" r="12" fill="#004735" />
  <circle cx="256" cy="256" r="6" fill="#FFFFFF" />

  <!-- Top Glass Highlight (Premium Feel) -->
  <path d="M 100 150 Q 256 20 412 150 Q 256 80 100 150 Z" fill="url(#glass)" />
</svg>
